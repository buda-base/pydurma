[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydurma"
version = "0.0.1"
authors = [
  { name="Elie", email="roux.elie@gmail.com" },
  { name="OpenPecha", email="dev@openpecha.org" },
]
description = "This package will produce vulgate text"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fast-diff-match-patch>=2.0.1",
    "pypandoc>=1.11",
    "prettytable>=3.8.0",
    "regex",
]

[tool.setuptools.packages.find]
include = ["pydurma*"]

[tool.setuptools.package-data]
pydurma = ["res/bo/*.txt"]

[project.optional-dependencies]
opf = [
    "openpecha>=0.9.23",
]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
]


[project.urls]
"Homepage" = "https://github.com/buda-base/pydurma"
"Bug Tracker" = "https://github.com/buda-base/pydurma/issues"
